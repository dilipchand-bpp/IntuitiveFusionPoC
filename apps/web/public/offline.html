<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4254C5" />
    <title>You are offline – Intuitive Fusion</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7fb;
        color: #1a1d2e;
      }
      main {
        max-width: 26rem;
        padding: 2rem;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
      }
      button {
        font: inherit;
        font-weight: 600;
        min-height: 44px;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 8px;
        background: #4254c5;
        color: #fff;
        cursor: pointer;
      }
      p {
        line-height: 1.5;
        color: #4a4f66;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>
        Intuitive Fusion needs a connection to show your procurements. Nothing was lost: anything you had
        saved is safe on the server.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
